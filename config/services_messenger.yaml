# message handlers, registered as soon as symfony/messenger is installed
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Batteryincluded\BatteryincludedBundle\Messenger\:
        resource: '../src/Messenger'
        exclude: '../src/Messenger/*Message.php'

    # export of the scheduler (export.schedule), dispatch an ExportMessage to start an export asynchronously
    Batteryincluded\BatteryincludedBundle\Scheduler\ExportMessageHandler: ~
