# the http client chain and the api clients of the collections are registered in BatteryincludedBundle::loadExtension(),
# batteryincluded.sdk_dir is set there as well
services:
    _defaults:
        autowire: true
        autoconfigure: true

    Batteryincluded\BatteryincludedBundle\:
        resource: '../src'
        exclude:
            - '../src/BatteryincludedBundle.php'
            - '../src/Client'
            - '../src/Collection'
            - '../src/Demo'
            - '../src/Doctrine'
            - '../src/Document/Document.php'
            - '../src/Event'
            - '../src/Exception'
            - '../src/Http/Attribute'
            - '../src/Messenger'
            - '../src/Scheduler'
            - '../src/Sync/DiffResult.php'
            - '../src/Sync/ExportReport.php'
            - '../src/Sync/SyncResult.php'
            - '../src/Test'

    BatteryIncludedSdk\:
        resource : '%batteryincluded.sdk_dir%'
        # functions only, loaded by the composer autoloader
        exclude: '%batteryincluded.sdk_dir%/Polyfill'

    Batteryincluded\BatteryincludedBundle\Profiler\ApiDataCollector:
        tags:
            -
                name: data_collector
                id: 'Batteryincluded\BatteryincludedBundle\Profiler\ApiDataCollector'
                template: '@Batteryincluded/profiler/template.html.twig'

    Batteryincluded\BatteryincludedBundle\Commands\ExportCommand:
        arguments:
            $batchSize: '%batteryincluded.export.batch_size%'
            $lockFactory: '@?lock.factory'
            $eventDispatcher: '@?event_dispatcher'

    Batteryincluded\BatteryincludedBundle\Sync\DocumentSynchronizer:
        arguments:
            $batchSize: '%batteryincluded.export.batch_size%'
            $eventDispatcher: '@?event_dispatcher'

    Batteryincluded\BatteryincludedBundle\Sync\CollectionComparator:
        arguments:
            $batchSize: '%batteryincluded.export.batch_size%'
            $eventDispatcher: '@?event_dispatcher'

    # the suggest configuration is set in BatteryincludedBundle::loadExtension()
    Batteryincluded\BatteryincludedBundle\Suggest\Suggester:
        arguments:
            $eventDispatcher: '@?event_dispatcher'

    Batteryincluded\BatteryincludedBundle\Suggest\SuggestController:
        public: true
        tags: ['controller.service_arguments']

    Batteryincluded\BatteryincludedBundle\Document\DocumentUrlGenerator:
        arguments:
            $resolvers: !tagged_iterator batteryincluded.document_url_resolver

    Batteryincluded\BatteryincludedBundle\Twig\BatteryIncludedRuntime:
        arguments:
            $requestStack: '@?request_stack'
            $debug: '%kernel.debug%'

    # the queue listens to every request and command, the synchronizer (and the environment variables of the
    # collections) is created only when changes are sent, commands like cache:clear work without credentials
    Batteryincluded\BatteryincludedBundle\Sync\DocumentChangeQueue:
        arguments:
            $synchronizer: !service_closure '@Batteryincluded\BatteryincludedBundle\Sync\DocumentSynchronizer'
