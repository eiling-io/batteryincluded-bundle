parameters:
    vendor_dir: '%kernel.project_dir%/vendor'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Batteryincluded\BatteryincludedBundle\:
        resource: '../src'

    BatteryIncludedSdk\:
        resource : '%vendor_dir%/batteryincluded/batteryincluded-php-sdk/src'

    BatteryIncludedSdk\Client\ApiClient:
        class: BatteryIncludedSdk\Client\ApiClient
        arguments:
            $httpClient: '@Batteryincluded\BatteryincludedBundle\Client\CurlHttpClient'
            $baseUrl: '%env(resolve:BATTERYINCLUDED_BASE_URL)%'
            $collection: '%env(resolve:BATTERYINCLUDED_COLLECTION)%'
            $apiKey: '%env(resolve:BATTERYINCLUDED_API_KEY)%'

    Batteryincluded\BatteryincludedBundle\Profiler\ApiDataCollector:
        tags:
            -
                name: data_collector
                id: 'Batteryincluded\BatteryincludedBundle\Profiler\ApiDataCollector'
                template: '@Batteryincluded/profiler/template.html.twig'

    Batteryincluded\BatteryincludedBundle\Commands\ExportCommand:
        arguments:
            $syncService: '@BatteryIncludedSdk\Service\SyncService'
            $provider: !tagged_iterator 'Batteryincluded\BatteryincludedBundle\Provider\DataProviderInterface'
        tags:
            - { name: console.command, command: 'bi:export' }