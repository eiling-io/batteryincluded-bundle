title: BatteryIncluded Symfony Bundle
description: Symfony integration of the BatteryIncluded PHP SDK – export, sync, search, Doctrine, Messenger and the web profiler.
url: https://bundle.batteryincluded.eiling.io
baseurl: ""
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: eiling
# logo of the sidebar (variant of logo.svg for the dark background), without logo the title is shown as text
logo: /assets/images/logo-dark.svg
favicon_ico: /assets/images/favicon.png
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/eiling-io/batteryincluded-bundle
  Packagist: https://packagist.org/packages/batteryincluded/batteryincluded-bundle
  PHP SDK: https://eiling-io.github.io/batteryincluded-php-sdk/
  eiling.io: https://eiling.io

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/eiling-io/batteryincluded-bundle
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: edit

# the local Jekyll preview files are not part of the site
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      layout: default

callouts:
  note:
    title: Note
    color: blue
  important:
    title: Important
    color: yellow
  warning:
    title: Warning
    color: red
